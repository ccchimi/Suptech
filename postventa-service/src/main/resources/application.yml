spring:
  application:
    name: postventa-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postventa}
    username: ${DB_USER:postventa}
    password: ${DB_PASSWORD:postventa}
    hikari:
      pool-name: postventa-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  boot:
    admin:
      client:
        enabled: ${ADMIN_CLIENT_ENABLED:true}
        url: ${ADMIN_SERVER_URL:http://localhost:8090}
        instance:
          name: ${spring.application.name}
          service-host-type: ip
          metadata:
            equipo: postventa
            criticidad: alta
        username: ${ADMIN_CLIENT_USER:}
        password: ${ADMIN_CLIENT_PASSWORD:}
        period: 10s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump,scheduledtasks,circuitbreakers,circuitbreakerevents,retries,retryevents,env,httpexchanges
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      show-values: when-authorized
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      servicio: ${spring.application.name}

info:
  app:
    nombre: API de Soporte y Postventa
    descripcion: Reembolsos, reclamos, devoluciones y cancelaciones de pedidos

postventa:
  integracion:
    pedidos:
      base-url: ${PEDIDOS_URL:http://localhost:8082}
      connect-timeout: 2s
      read-timeout: 5s
    inventario:
      base-url: ${INVENTARIO_URL:http://localhost:8083}
      connect-timeout: 2s
      read-timeout: 5s
  saga:
    reconciliacion:
      intervalo: PT15S
      retardo-inicial: PT30S
      tamano-lote: 100

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - com.suptech.postventa.infrastructure.adapter.out.client.IntegracionTransitoriaException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
    instances:
      pedidos:
        base-config: default
      inventario:
        base-config: default

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.suptech.postventa.infrastructure.adapter.out.client.IntegracionTransitoriaException
          - org.springframework.web.client.ResourceAccessException
    instances:
      pedidos:
        base-config: default
      inventario:
        base-config: default

logging:
  level:
    com.suptech.postventa: INFO
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: local
  boot:
    admin:
      client:
        enabled: false
logging:
  level:
    com.suptech.postventa: DEBUG
    org.springframework.web.client: DEBUG
