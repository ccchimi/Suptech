name: Seguridad

# =================================================================================================
# Tres analisis independientes, cada uno con su propia puerta:
#
#   dependencias  OWASP Dependency-Check: CVEs conocidos en las librerias que viajan en el jar.
#   codigo        CodeQL (SAST): inyecciones, deserializacion insegura, SSRF, etc. en nuestro codigo.
#   imagen        Trivy: paquetes del sistema y jars de la imagen del servicio.
#
# Todos publican SARIF en la pestaña Security > Code scanning del repositorio, asi que los
# hallazgos quedan con historial, se pueden descartar con motivo y aparecen anotados en los PR.
#
# Corre tambien una vez por semana: las vulnerabilidades nuevas se publican aunque el codigo no
# cambie, y una dependencia limpia el lunes puede tener un CVE critico el jueves.
#
# Las excepciones aceptadas viven en postventa-service/dependency-check-suppressions.xml y
# postventa-service/.trivyignore.yaml,
# siempre con motivo y fecha de vencimiento.
# =================================================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # lunes 06:00 en Buenos Aires
  workflow_dispatch:

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  dependencias:
    name: Dependencias (OWASP Dependency-Check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    defaults:
      run:
        working-directory: postventa-service
    steps:
      - uses: actions/checkout@v4

      # Sin clave, el NVD limita tanto las consultas que la primera descarga tarda horas y el
      # job termina por timeout. Se avisa y se salta en vez de dejar el pipeline en rojo.
      # La clave es gratuita: https://nvd.nist.gov/developers/request-an-api-key
      - name: Comprobar la clave del NVD
        id: clave
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::Falta el secreto NVD_API_KEY: se omite Dependency-Check."
            echo "presente=false" >> "$GITHUB_OUTPUT"
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar JDK 21
        if: steps.clave.outputs.presente == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # La base del NVD pesa cientos de MB. Se cachea por semana: el job solo descarga lo nuevo.
      - name: Cache de la base de vulnerabilidades
        if: steps.clave.outputs.presente == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Analizar dependencias
        id: analisis
        if: steps.clave.outputs.presente == 'true'
        run: chmod +x mvnw && ./mvnw -B -ntp -Pseguridad verify -DskipTests

      - name: Publicar en Code scanning
        if: always() && steps.clave.outputs.presente == 'true' && hashFiles('postventa-service/target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: postventa-service/target/dependency-check-report.sarif
          category: dependency-check

      - name: Guardar el informe HTML
        if: always() && steps.clave.outputs.presente == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: postventa-service/target/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 14

  codigo:
    name: Codigo (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # build-mode none: CodeQL extrae el codigo Java sin compilarlo, sin depender del JDK
      # ni de descargar dependencias.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          # security-extended suma consultas de mayor cobertura y algo menos de precision que
          # las por defecto; para un servicio que mueve reembolsos compensa revisar de mas.
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java

  imagen:
    name: Imagen (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: postventa-service
          load: true
          push: false
          tags: postventa-service:escaneo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Accion de terceros fijada por SHA y no por etiqueta: una etiqueta se puede mover y
      # hacer que el pipeline ejecute codigo distinto del que se reviso.
      - name: Escanear (informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: postventa-service:escaneo
          format: sarif
          output: trivy-imagen.sarif
          trivyignores: postventa-service/.trivyignore.yaml

      - name: Publicar en Code scanning
        if: always() && hashFiles('trivy-imagen.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-imagen.sarif
          category: trivy-imagen

      # Puerta: corta ante vulnerabilidades altas o criticas que ya tienen version corregida.
      # Las que no tienen arreglo publicado no se pueden resolver subiendo una version y solo
      # generarian ruido; quedan visibles igual en Code scanning.
      - name: Puerta (HIGH y CRITICAL con arreglo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: postventa-service:escaneo
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: postventa-service/.trivyignore.yaml
          skip-setup-trivy: true
