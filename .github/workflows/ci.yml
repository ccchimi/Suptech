name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postventa-service
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permisos del wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar la suite completa
        run: ./mvnw -B -ntp verify

      - name: Publicar informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: postventa-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: postventa-service
          push: false
          tags: suptech/postventa-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
